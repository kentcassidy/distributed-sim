# ─────────────────────────────────────────────────────────────────────────────
# Distributed Flight-Dynamics Federation — dev / build orchestration
# MVP: a single build+dev container (ADR-0012 base image) with the repo mounted.
#   docker compose build
#   docker compose run --rm dev        # drops you into /work with the toolchain
# The multi-federate + tc netem harness is POST-MVP — scaffold sketched below.
# ─────────────────────────────────────────────────────────────────────────────
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: dff/dev:local
    working_dir: /mnt
    # Edit on the host; compile/run/debug inside the container.
    volumes:
      - .:/mnt
    # Keep an interactive shell available for `docker compose run`.
    stdin_open: true
    tty: true

